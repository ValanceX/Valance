# This project is its own root: it is not part of the Valance workspace, because it must resolve MESH and PORT from their
# development checkouts (see package.json "overrides" and README.md), which the other examples must not.
packages: []
allowBuilds:
  esbuild: false
minimumReleaseAgeExclude:
  - '@valancex/mesh-compiler@0.10.0'
  - '@valancex/mesh-runtime@0.10.0'
  - '@valancex/nexus@0.12.0'
  - '@valancex/port-web@0.4.0'
  - '@valancex/valance@0.7.0'
