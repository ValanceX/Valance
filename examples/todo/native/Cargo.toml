[package]
name = "todo-desktop"
version = "0.0.0"
edition = "2021"
publish = false
description = "The to-do desktop app: a window, drawn by the Desktop PORT, over the application's engine."

[[bin]]
name = "todo-desktop"
path = "src/main.rs"

[dependencies]
# The Desktop PORT is its own package in the PORT repository. Until it is published to crates.io the build takes it from there, at a fixed revision (Cargo.lock records it too).
valancex-port-desktop = { git = "https://github.com/ValanceX/Port", rev = "5d25bd9b5e0079d33f52c21532d92889efb73dbb" }
eframe = { version = "0.31", default-features = false }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
