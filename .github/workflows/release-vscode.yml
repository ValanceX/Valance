name: Release the VS Code extension

# Builds the VALANCE extension (editors/vscode) from its tag and publishes it. The extension is
# versioned on its own, not with the @valancex/* packages, so it has its own tag: `vscode-v<version>`,
# where <version> is `version` in editors/vscode/package.json.
#
# - A pushed `vscode-v*` tag publishes. Tagging the release commit is the maintainer's step.
# - A manual run publishes only with `publish` set, and only from a tag; otherwise it is a dry run:
#   everything but the publishing.
# - A pull request that changes the extension's version or this workflow runs the dry run, so a
#   release is checked before it is tagged.
#
# Publishing stores NO long-lived token. Each destination authenticates the workflow itself, and is
# skipped (with a warning) when it is not set up:
#
#   Visual Studio Marketplace (publisher `valancex`) - Microsoft Entra ID, because global Azure DevOps
#   Personal Access Tokens are retired. Either of:
#     * Entra ID, with GitHub's OIDC token federated to an Entra app (a "federated credential" for this
#       repository and the tag environment): set the repository VARIABLES AZURE_CLIENT_ID and
#       AZURE_TENANT_ID. The app's service principal must be a member of the publisher. The workflow
#       signs in with azure/login and runs `vsce publish --azure-credential`.
#     * the Marketplace's own trusted publishing policy for this repository and workflow: set the
#       repository VARIABLE VSCE_OIDC to `true`. The workflow runs `vsce publish --oidc`.
#   Open VSX (namespace `valancex`) - a trusted publisher registered for this repository and workflow
#   at https://open-vsx.org/user-settings/trusted-publishers; nothing to set here. (An `OVSX_PAT`
#   secret, if one exists, takes precedence; none is needed.)
#
# The GitHub release (the .vsix and the version's changelog entry) needs none of this.

on:
  push:
    tags: ["vscode-v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish and make the GitHub release (only from a tag)"
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/release-vscode.yml
      - editors/vscode/package.json
      - editors/vscode/CHANGELOG.md

permissions:
  contents: read

concurrency:
  group: release-vscode-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # All of CI, on the commit being released (it includes the extension's tests in a real VS Code).
  ci:
    uses: ./.github/workflows/ci.yml

  package:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Check the version
        run: |
          version="$(node -p 'require("./editors/vscode/package.json").version')"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "vscode-v${version}" ]; then
            echo "::error::The tag is ${GITHUB_REF_NAME}, but the extension is ${version}: tag vscode-v${version}"
            exit 1
          fi
          if ! grep -q "^## \[${version}\]" editors/vscode/CHANGELOG.md; then
            echo "::error::editors/vscode/CHANGELOG.md has no entry for ${version}"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Build and package
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          cd editors/vscode
          pnpm install --frozen-lockfile
          pnpm package
          # the package carries the bundle and the documents, and nothing else
          pnpm exec vsce ls --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: editors/vscode/valance-${{ env.VERSION }}.vsix
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # the OIDC token that Entra ID, the Marketplace and Open VSX exchange for a short-lived credential
    env:
      PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      VSCE_OIDC: ${{ vars.VSCE_OIDC }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: out
      - name: Check what is being released
        run: |
          version="$(node -p 'require("./editors/vscode/package.json").version')"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "TAG=vscode-v${version}" >> "$GITHUB_ENV"
          ls -l out
          if [ "$(ls out/*.vsix | wc -l)" != "1" ] || [ ! -f "out/valance-${version}.vsix" ]; then
            echo "::error::Expected exactly out/valance-${version}.vsix"
            exit 1
          fi
          if [ "$PUBLISH" = "true" ] && [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Publishing needs a tag: push vscode-v${version}"
            exit 1
          fi
          # this version's entry in the changelog is the release's notes
          awk -v v="${version}" '$0 ~ "^## \\[" v "\\]" { on = 1; next } /^## \[/ { on = 0 } on' editors/vscode/CHANGELOG.md > notes.md
          test -s notes.md
      - name: Sign in to Microsoft Entra ID
        if: env.PUBLISH == 'true' && env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Visual Studio Marketplace
        if: env.PUBLISH == 'true'
        working-directory: editors/vscode
        run: |
          pnpm install --frozen-lockfile --ignore-workspace
          vsix="$GITHUB_WORKSPACE/out/valance-${VERSION}.vsix"
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_TENANT_ID" ]; then
            pnpm exec vsce publish --packagePath "$vsix" --azure-credential
          elif [ "$VSCE_OIDC" = "true" ]; then
            pnpm exec vsce publish --packagePath "$vsix" --oidc
          else
            echo "::warning::Neither Microsoft Entra ID (AZURE_CLIENT_ID and AZURE_TENANT_ID) nor VSCE_OIDC is set: not published to the Visual Studio Marketplace"
          fi
      - name: Open VSX (trusted publishing)
        if: env.PUBLISH == 'true'
        run: |
          # Fails, and says why, if the namespace has no trusted publisher for this repository and workflow.
          npx --yes ovsx@1.2.0 publish "out/valance-${VERSION}.vsix" --trusted-publishing
      - name: GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --title "VALANCE for VS Code ${VERSION}" --notes-file notes.md --verify-tag "out/valance-${VERSION}.vsix"
