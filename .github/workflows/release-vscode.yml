name: Release the VS Code extension

# Builds the VALANCE extension (editors/vscode) from its tag and publishes it. The extension is
# versioned on its own, not with the @valancex/* packages, so it has its own tag: `vscode-v<version>`,
# where <version> is `version` in editors/vscode/package.json.
#
# - A pushed `vscode-v*` tag publishes. Tagging the release commit is the maintainer's step.
# - A manual run publishes only with `publish` set, and only from a tag; otherwise it is a dry run:
#   everything but the publishing.
# - A manual run with `verify_auth` set (from a branch) signs in to Microsoft Entra ID and checks the
#   Marketplace publisher with `vsce verify-pat`. It never publishes, tags or makes a release.
# - A pull request that changes the extension's version or this workflow runs the dry run, so a
#   release is checked before it is tagged. A pull request never reaches the publishing identity.
#
# Jobs and what each can reach:
#   ci, package, check   no credentials, no environment, `contents: read` only. Run for every trigger.
#   verify-auth          the environment below + `id-token: write`. Manual runs with `verify_auth` only.
#   publish              the environment below + `id-token: write` + `contents: write`. A pushed tag, or
#                        a manual run with `publish` set from a tag, only.
#
# Visual Studio Marketplace (publisher `valancex`) uses Microsoft Entra ID, because global Azure DevOps
# Personal Access Tokens are retired: no token is stored. GitHub's OIDC token is exchanged for an Entra
# access token (`azure/login`, then `vsce ... --azure-credential`). One-off setup:
#   * the GitHub environment `github-actions-vscode-publish` (restrict its deployment branches and tags
#     to the trusted branch and `vscode-v*`; its name is part of the federated credential's subject),
#   * a federated credential on the Entra app whose subject is that environment of this repository,
#   * the repository VARIABLES AZURE_CLIENT_ID and AZURE_TENANT_ID,
#   * the app's service principal added as a member of the `valancex` publisher.
# Open VSX (namespace `valancex`) is published with the secret OVSX_PAT, and skipped with a warning when
# it is not set. (Open VSX trusted publishing is not used until a trusted publisher is registered.)
#
# The GitHub release (the .vsix and the version's changelog entry) needs none of this.

on:
  push:
    tags: ["vscode-v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish and make the GitHub release (only from a tag)"
        type: boolean
        default: false
      verify_auth:
        description: "Sign in to Entra ID and check the Marketplace publisher; publishes nothing"
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/release-vscode.yml
      - editors/vscode/package.json
      - editors/vscode/CHANGELOG.md

permissions:
  contents: read

concurrency:
  group: release-vscode-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # All of CI, on the commit being released (it includes the extension's tests in a real VS Code).
  ci:
    uses: ./.github/workflows/ci.yml

  package:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Check the version
        run: |
          version="$(node -p 'require("./editors/vscode/package.json").version')"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "vscode-v${version}" ]; then
            echo "::error::The tag is ${GITHUB_REF_NAME}, but the extension is ${version}: tag vscode-v${version}"
            exit 1
          fi
          if ! grep -q "^## \[${version}\]" editors/vscode/CHANGELOG.md; then
            echo "::error::editors/vscode/CHANGELOG.md has no entry for ${version}"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Build and package
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          cd editors/vscode
          pnpm install --frozen-lockfile
          pnpm package
          # the package carries the bundle and the documents, and nothing else
          pnpm exec vsce ls --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: editors/vscode/valance-${{ env.VERSION }}.vsix
          if-no-files-found: error

  # What is being released, checked without any credential. Every trigger runs it, and the publish job
  # needs it, so a manual `publish` outside a tag fails here, before anything is signed in.
  check:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: out
      - name: Check what is being released
        env:
          PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        run: |
          version="$(node -p 'require("./editors/vscode/package.json").version')"
          ls -l out
          if [ "$(ls out/*.vsix | wc -l)" != "1" ] || [ ! -f "out/valance-${version}.vsix" ]; then
            echo "::error::Expected exactly out/valance-${version}.vsix"
            exit 1
          fi
          if [ "$PUBLISH" = "true" ] && [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Publishing needs a tag: push vscode-v${version}"
            exit 1
          fi
          # this version's entry in the changelog is the release's notes
          awk -v v="${version}" '$0 ~ "^## \\[" v "\\]" { on = 1; next } /^## \[/ { on = 0 } on' editors/vscode/CHANGELOG.md > notes.md
          test -s notes.md

  # A manual smoke test of the Entra ID federation, to run before the first release. It signs in the way
  # `publish` does (same environment, so the same federated-credential subject) and only asks the
  # Marketplace whether the app may publish for `valancex`.
  verify-auth:
    needs: check
    if: github.event_name == 'workflow_dispatch' && inputs.verify_auth && !inputs.publish && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    environment: github-actions-vscode-publish
    permissions:
      contents: read
      id-token: write # the OIDC token that Entra ID exchanges for a short-lived credential
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sign in to Microsoft Entra ID
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Check the Marketplace publisher
        working-directory: editors/vscode
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          pnpm install --frozen-lockfile --ignore-workspace
          pnpm exec vsce verify-pat valancex --azure-credential

  publish:
    needs: check
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_type == 'tag')
    runs-on: ubuntu-latest
    environment: github-actions-vscode-publish
    permissions:
      contents: write # the GitHub release
      id-token: write # the OIDC token that Entra ID exchanges for a short-lived credential
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the artifact `package` built and `check` verified, not a rebuild
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: out
      - name: What is being released
        run: |
          version="$(node -p 'require("./editors/vscode/package.json").version')"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "TAG=vscode-v${version}" >> "$GITHUB_ENV"
          test -f "out/valance-${version}.vsix"
          awk -v v="${version}" '$0 ~ "^## \\[" v "\\]" { on = 1; next } /^## \[/ { on = 0 } on' editors/vscode/CHANGELOG.md > notes.md
          test -s notes.md
      - name: Sign in to Microsoft Entra ID
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Visual Studio Marketplace
        working-directory: editors/vscode
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          pnpm install --frozen-lockfile --ignore-workspace
          pnpm exec vsce publish --packagePath "$GITHUB_WORKSPACE/out/valance-${VERSION}.vsix" --azure-credential
      - name: Open VSX
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT is not set: not published to Open VSX"
          else
            npx --yes ovsx@0.10.1 publish "out/valance-${VERSION}.vsix" --pat "$OVSX_PAT"
          fi
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --title "VALANCE for VS Code ${VERSION}" --notes-file notes.md --verify-tag "out/valance-${VERSION}.vsix"
