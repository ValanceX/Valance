name: Release the VS Code extension

# Builds the VALANCE extension (editors/vscode) from its tag and publishes it. The extension is
# versioned on its own, not with the @valancex/* packages, so it has its own tag: `vscode-v<version>`,
# where <version> is `version` in editors/vscode/package.json.
#
# - A pushed `vscode-v*` tag publishes. Tagging the release commit is the maintainer's step.
# - A manual run publishes only with `publish` set, and only from a tag; otherwise it is a dry run:
#   everything but the publishing.
# - A pull request that changes the extension's version or this workflow runs the dry run, so a
#   release is checked before it is tagged.
#
# Publishing needs secrets, and each destination is skipped (with a warning) when its secret is absent:
#   VSCE_PAT   a Personal Access Token for the Visual Studio Marketplace publisher `valancex`
#              (Azure DevOps, scope Marketplace > Manage). It expires.
#   OVSX_PAT   an Open VSX access token, for the namespace `valancex`.
# The GitHub release (the .vsix and the version's changelog entry) needs neither.

on:
  push:
    tags: ["vscode-v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish and make the GitHub release (only from a tag)"
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/release-vscode.yml
      - editors/vscode/package.json
      - editors/vscode/CHANGELOG.md

permissions:
  contents: read

concurrency:
  group: release-vscode-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # All of CI, on the commit being released (it includes the extension's tests in a real VS Code).
  ci:
    uses: ./.github/workflows/ci.yml

  package:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Check the version
        run: |
          version="$(node -p 'require("./editors/vscode/package.json").version')"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "vscode-v${version}" ]; then
            echo "::error::The tag is ${GITHUB_REF_NAME}, but the extension is ${version}: tag vscode-v${version}"
            exit 1
          fi
          if ! grep -q "^## \[${version}\]" editors/vscode/CHANGELOG.md; then
            echo "::error::editors/vscode/CHANGELOG.md has no entry for ${version}"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Build and package
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          cd editors/vscode
          pnpm install --frozen-lockfile
          pnpm package
          # the package carries the bundle and the documents, and nothing else
          pnpm exec vsce ls --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: editors/vscode/valance-${{ env.VERSION }}.vsix
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
    env:
      PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: out
      - name: Check what is being released
        run: |
          version="$(node -p 'require("./editors/vscode/package.json").version')"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "TAG=vscode-v${version}" >> "$GITHUB_ENV"
          ls -l out
          if [ "$(ls out/*.vsix | wc -l)" != "1" ] || [ ! -f "out/valance-${version}.vsix" ]; then
            echo "::error::Expected exactly out/valance-${version}.vsix"
            exit 1
          fi
          if [ "$PUBLISH" = "true" ] && [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Publishing needs a tag: push vscode-v${version}"
            exit 1
          fi
          # this version's entry in the changelog is the release's notes
          awk -v v="${version}" '$0 ~ "^## \\[" v "\\]" { on = 1; next } /^## \[/ { on = 0 } on' editors/vscode/CHANGELOG.md > notes.md
          test -s notes.md
      - name: Visual Studio Marketplace
        if: env.PUBLISH == 'true'
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT is not set: not published to the Visual Studio Marketplace"
          else
            cd editors/vscode && pnpm install --frozen-lockfile --ignore-workspace && pnpm exec vsce publish --packagePath "$GITHUB_WORKSPACE/out/valance-${VERSION}.vsix" --pat "$VSCE_PAT"
          fi
      - name: Open VSX
        if: env.PUBLISH == 'true'
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT is not set: not published to Open VSX"
          else
            npx --yes ovsx@0.10.1 publish "out/valance-${VERSION}.vsix" --pat "$OVSX_PAT"
          fi
      - name: GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --title "VALANCE for VS Code ${VERSION}" --notes-file notes.md --verify-tag "out/valance-${VERSION}.vsix"
