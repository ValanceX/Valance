name: Release

# Builds a VALANCE release from its tag and publishes it, as PORT's and MESH's
# release.yml do: all of CI on the tagged commit, then the packages packed,
# published to npm with provenance, and a GitHub release with the tarballs and
# the version's release notes.
#
# The release is three packages with ONE version, in this order (each depends
# on the one before): @valancex/valance, @valancex/common (what an
# application's src/main.ts imports, and the runtime the build runs) and
# @valancex/cli (the `vlx` command).
#
# - A pushed `v<number>…` tag publishes (not `vscode-v*`, which is the extension's: release-vscode.yml). Its tag must be `v` + the version of all three
#   packages (packages/*/package.json), which must agree. Tagging the release
#   commit is the maintainer's step.
# - A manual run publishes only with `publish` set, and only from a tag;
#   otherwise it's a dry run: everything but the publishing.
# - A pull request that changes this workflow or a package's version runs the
#   dry run, so a release is checked before it is tagged.
#
# The release notes are docs/releases/vX.Y.Z.md when that file exists (a patch
# release), and otherwise docs/releases/vX.Y.md.
#
# Publishing needs the `NPM_ACCESS_TOKEN` secret: an npm granular access
# token that can publish to the @valancex organisation. It expires; a
# release needs a current one.

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm and make the GitHub release (only from a tag)"
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packages/valance/package.json
      - packages/common/package.json
      - packages/cli/package.json
      - packages/router/package.json
      - packages/style/package.json

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # All of CI, on the commit being released.
  ci:
    uses: ./.github/workflows/ci.yml

  # The conformance report (decision A15), regenerated for this release candidate: the specification verifiers
  # (vnu, the name rule, aria-query, stylelint, DTCG, the Web PORT in jsdom and Chromium, a terminal PORT, the
  # Desktop's accessibility tree through accesskit_consumer, the session logs) each run, each must find its
  # deliberately wrong input, and the step FAILS when a verifier fails or a required one did not run. The
  # report is uploaded; it is signed by the accessibility maintainer, not here.
  conformance:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ValanceX/Port
          path: port
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm --filter @valancex/conformance exec playwright install --with-deps chromium
      - name: Conformance report
        env:
          PORT_DIR: ${{ github.workspace }}/port
        run: |
          node packages/conformance/scripts/report.mjs --check \
            --require html,names,roles,css,tokens,vectors-jsdom,vectors-terminal,chromium,desktop \
            --out conformance-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-report
          path: conformance-report.json

  pack:
    needs: [ci, conformance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Build and pack
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          mkdir -p out
          # `workspace:^` ranges are written as real ones by pack.
          pnpm --filter @valancex/valance pack --pack-destination "$PWD/out"
          pnpm --filter @valancex/style pack --pack-destination "$PWD/out"
          pnpm --filter @valancex/common pack --pack-destination "$PWD/out"
          pnpm --filter @valancex/cli pack --pack-destination "$PWD/out"
          pnpm --filter @valancex/router pack --pack-destination "$PWD/out"
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: out/
          if-no-files-found: error

  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # npm provenance
    env:
      PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: out
      - name: Check what is being released
        run: |
          ls -l out
          version="$(node -p 'require("./packages/valance/package.json").version')"
          tag="v${version}"
          echo "TAG=${tag}" >> "$GITHUB_ENV"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          for package in style common cli router; do
            other="$(node -p "require('./packages/${package}/package.json').version")"
            if [ "$other" != "$version" ]; then
              echo "::error::@valancex/${package} is ${other} but @valancex/valance is ${version}: the five packages share one version"
              exit 1
            fi
          done
          for package in valance style common cli router; do
            if [ ! -f "out/valancex-${package}-${version}.tgz" ]; then
              echo "::error::Expected out/valancex-${package}-${version}.tgz"
              exit 1
            fi
          done
          if [ "$(ls out/*.tgz | wc -l)" != "5" ]; then
            echo "::error::Expected exactly five tarballs"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::The tag is ${GITHUB_REF_NAME}, but the packages are ${version}: tag ${tag}"
            exit 1
          fi
          if [ "$PUBLISH" = "true" ] && [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Publishing needs a tag: push ${tag}"
            exit 1
          fi
          notes="docs/releases/v${version}.md"
          if [ ! -f "$notes" ]; then
            notes="docs/releases/v$(echo "$version" | cut -d. -f1,2).md"
          fi
          if [ ! -f "$notes" ]; then
            echo "::error::No release notes at docs/releases/v${version}.md or ${notes}"
            exit 1
          fi
          echo "NOTES=${notes}" >> "$GITHUB_ENV"
          # The packed ranges between the five must name this version.
          for package in style common cli router; do
            tar -xzOf "out/valancex-${package}-${version}.tgz" package/package.json | node -e '
              const manifest = JSON.parse(require("fs").readFileSync(0, "utf8"));
              const bad = Object.entries(manifest.dependencies ?? {}).filter(([name, range]) => name.startsWith("@valancex/") && range.startsWith("workspace:"));
              if (bad.length > 0) { console.error("::error::" + manifest.name + " still has workspace ranges: " + JSON.stringify(bad)); process.exit(1); }
            '
          done
          for package in valance style common cli router; do
            if npm view "@valancex/${package}@${version}" version > /dev/null 2>&1; then
              if [ "$PUBLISH" = "true" ]; then
                echo "::error::@valancex/${package}@${version} is already on npm"
                exit 1
              fi
              echo "::warning::@valancex/${package}@${version} is already on npm; a release needs a version bump"
            fi
          done
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
        run: |
          # Absolute, so npm reads each tarball as a file, not a GitHub spec. In dependency order.
          for package in valance style common cli router; do
            tarball="$PWD/out/valancex-${package}-${VERSION}.tgz"
            if [ "$PUBLISH" = "true" ]; then
              npm publish "$tarball" --access public --provenance
            else
              npm publish "$tarball" --access public --provenance=false --dry-run
            fi
          done
      - name: GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --title "VALANCE $TAG" --notes-file "$NOTES" --verify-tag out/*.tgz
