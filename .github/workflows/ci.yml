name: CI

on:
  # Branch pushes only: a release tag runs all of CI through release.yml.
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # The release workflow runs all of CI on the tagged commit first.
  workflow_call:

jobs:
  # Lint and format with OXC (oxlint, oxfmt): fast, and it needs nothing built.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @valancex/tracer-web exec playwright install chromium
      - run: pnpm test:browser
      - run: pnpm test:examples

  # The VS Code extension (editors/vscode), in a real VS Code: the oldest version it supports and the current one. The unit tests use VS Code's grammar engine and the real mesh-lsp and
  # valance; the host suite launches VS Code (under a virtual display) with the extension and drives it on a copy of examples/docs-app. Its own pnpm root, so the workspace jobs above do
  # not depend on it.
  vscode:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vscode: ["1.90.0", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The example and the packages it needs (valance, mesh-lsp) are built by the workspace.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install the extension's dependencies
        working-directory: editors/vscode
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: editors/vscode
        run: pnpm typecheck
      - name: Unit tests (grammar, project, real mesh-lsp, real valance)
        working-directory: editors/vscode
        run: pnpm test
      - name: Package (the .vsix the release publishes)
        working-directory: editors/vscode
        run: pnpm package
      - uses: actions/cache@v4
        with:
          path: editors/vscode/.vscode-test
          key: vscode-${{ matrix.vscode }}-${{ hashFiles('editors/vscode/pnpm-lock.yaml') }}
      - name: Host tests (VS Code ${{ matrix.vscode }})
        working-directory: editors/vscode
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
        run: xvfb-run -a pnpm test:host

  # The to-do desktop app (examples/todo), built and run on the platforms it ships for: the application and its engine with Node, the native renderer with Rust, then the packaged engine
  # (a Node single executable) is run through the wire. Windows is a real Windows build here, not the Linux cross-build. It builds only what it needs from the workspace.
  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: win32-x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the application and its engine
        run: pnpm --filter "@valancex/todo..." build
      - name: Test the application (headless, through a text target)
        run: pnpm --filter @valancex/todo test
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            examples/todo/native/target
          key: desktop-${{ matrix.platform }}-${{ hashFiles('examples/todo/native/Cargo.lock') }}
      - name: Native renderer lints and tests (against the real engine, no window)
        working-directory: examples/todo/native
        run: |
          cargo fmt --check
          cargo test --locked
      - name: Package the engine as one executable and run it through the wire
        working-directory: examples/todo
        run: |
          node scripts/package.mjs ${{ matrix.platform }}
          node scripts/smoke.mjs out/${{ matrix.platform }}/todo-engine${{ matrix.os == 'windows-latest' && '.exe' || '' }}
      - name: Build the renderer
        working-directory: examples/todo/native
        run: cargo build --release --locked
      - name: Gather the app
        working-directory: examples/todo
        run: cp native/target/release/todo-desktop${{ matrix.os == 'windows-latest' && '.exe' || '' }} out/${{ matrix.platform }}/
      - uses: actions/upload-artifact@v4
        with:
          name: todo-${{ matrix.platform }}
          path: examples/todo/out/${{ matrix.platform }}/
          if-no-files-found: error
